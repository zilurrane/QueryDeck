[package]
name = "querydeck"
version = "0.1.2"
description = "A fast, lightweight Microsoft SQL Server (MSSQL) desktop client — a slim alternative to SSMS / Azure Data Studio."
authors = ["Zilu Ramkrishna Rane <zilurrane@gmail.com>"]
license = "MIT"
repository = "https://github.com/zilurrane/QueryDeck"
homepage = "https://github.com/zilurrane/QueryDeck"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "querydeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiberius = { version = "0.12", features = ["chrono", "rust_decimal"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3"
chrono = "0.4"
rust_decimal = "1"
uuid = "1"
tauri-plugin-store = "2.4.3"
keyring = "2"
tauri-plugin-process = "2.3.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10.1"

